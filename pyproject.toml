[project]
name = "2048-pygame"
version = "1.0.0"
description = "A professional and addictive 2048 game built with pygame"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5.0",
]

[tool.uv]
dev-dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]